services:
  db:
    image: postgres:16
    container_name: twinforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: twinforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - twinforge_pgdata:/var/lib/postgresql/data

volumes:
  twinforge_pgdata:
